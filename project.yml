name: GymTracker
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  GymTracker:
    type: application
    platform: iOS
    sources:
      - GymTrackerApp.swift
      - Models.swift
      - ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymtracker.personal2026
        INFOPLIST_KEY_CFBundleDisplayName: GymTracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
